# 交叉编译 arm32 / arm64 静态 musl 二进制，可直接跑在 proot Ubuntu / Termux
name: ARM Musl Static

on:
  workflow_dispatch:
  push:
    branches: [arm32-musl-build]
    paths:
      - ".github/workflows/arm32-musl.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-musleabihf
            artifact: leaf-armv7-musl-static
          - target: aarch64-unknown-linux-musl
            artifact: leaf-arm64-musl-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build static release
        # strip=symbols 让 rustc 直接去掉符号表，无需额外 strip 工具
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Verify artifact
        run: |
          BIN=target/${{ matrix.target }}/release/leaf
          file "$BIN"
          readelf -h "$BIN" | grep -E "Class|Machine|Type"
          ls -lh "$BIN"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/leaf dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
